name: Publish tutorials
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage existing tutorials
        run: |
          mkdir -p _site/python _site/r
          cp -R DiffPy/docs/. _site/python/
          cp -R DiffR/inst/doc/. _site/r/
          cp DiffR/vignettes/DiffR.html _site/r/DiffR.html
          cp documentation-index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
